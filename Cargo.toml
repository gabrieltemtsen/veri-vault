[workspace]
resolver = "2"
members = [
    "contracts/master-vault",
    "contracts/policy-guard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VeriVault Quantitative Systems <core@verivault.near>"]
license = "MIT"
repository = "https://github.com/verivault/verivault"

[workspace.dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing", "legacy"] }
near-gas = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
